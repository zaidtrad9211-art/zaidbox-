name: Build Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and copy the web app into Android
        run: |
          npm ci
          npm run vendor
          npx cap sync android

      - name: Load signing key (from repo secrets)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "HAS_KEY=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret yet. Building a debug APK; add ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD secrets for installable updates."
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          TASK=assembleDebug; [ "$HAS_KEY" = "1" ] && TASK=assembleRelease
          set +e
          ./gradlew --no-daemon $TASK 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ]; then
            # Put the end of the log where it can be read without signing in.
            msg=$(grep -E "error|Error|FAILURE|What went wrong|wrong:|> " "$RUNNER_TEMP/gradle.log" | tail -40 | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failed::$msg"
            exit 1
          fi
          if [ "$HAS_KEY" = "1" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../tarrad-office.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk ../tarrad-office.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tarrad-office-apk
          path: tarrad-office.apk

      - name: Publish the APK as a release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "نسخة ${{ github.run_number }}"
          body: "نزّل tarrad-office.apk على التلفون وثبّته."
          files: tarrad-office.apk
          make_latest: true
