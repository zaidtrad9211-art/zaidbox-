<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E6B5C">
<title>حلقة جزء عمّ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --ink:#1E2A28; --muted:#6B7774; --line:#E3DED3;
  --brand:#0E6B5C; --brand-soft:#DCEFEA; --ok:#1F8A4C; --ok-soft:#DFF3E6;
  --bad:#C0392B; --bad-soft:#FBE3E0; --warn:#B7791F; --warn-soft:#FDF1D8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121816; --card:#1B2321; --ink:#E8EEEC; --muted:#9AA7A3; --line:#2C3633;
    --brand:#3FB39C; --brand-soft:#1D3A34; --ok:#4CC27E; --ok-soft:#183325;
    --bad:#EF6B5C; --bad-soft:#3A1E1B; --warn:#E3A941; --warn-soft:#382C14;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;font-size:17px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:14px 16px calc(12px);padding-top:calc(12px + env(safe-area-inset-top))}
header h1{margin:0;font-size:20px}
header .sub{font-size:14px;opacity:.85}
main{max-width:720px;margin:0 auto;padding:14px 16px}
nav{position:fixed;bottom:0;inset-inline:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ico{font-size:22px;line-height:1}
nav button.on{color:var(--brand);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:16px;margin:0 0 8px}
button,.btn{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;cursor:pointer}
.btn-main{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn-danger{color:var(--bad);border-color:var(--bad)}
.btn-sm{padding:6px 10px;font-size:14px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.att{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.att button{font-size:17px;padding:12px;font-weight:700}
.att .p.on{background:var(--ok);border-color:var(--ok);color:#fff}
.att .a.on{background:var(--bad);border-color:var(--bad);color:#fff}
.stu-name{font-weight:700;font-size:18px}
.badge{display:inline-block;font-size:13px;padding:2px 9px;border-radius:99px;font-weight:700}
.b-warn{background:var(--bad-soft);color:var(--bad)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-mid{background:var(--warn-soft);color:var(--warn)}
.b-brand{background:var(--brand-soft);color:var(--brand)}
.alert{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.info{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand)}
.surahs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.surah{padding:8px 6px;text-align:center;font-size:15px;border-radius:10px}
.surah small{display:block;font-size:12px;color:var(--muted)}
.surah.s-learning{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.surah.s-done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.list-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1}
.tabs button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.log{font-size:15px;padding:8px 0;border-bottom:1px dashed var(--line)}
.log:last-child{border-bottom:0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.summary div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.summary b{display:block;font-size:22px}
.hide{display:none!important}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
dialog .dbody{padding:12px 16px 16px;max-height:75vh;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>حلقة جزء عمّ</h1>
  <div class="sub" id="hsub">متابعة الحفظ والحضور</div>
</header>

<main>
  <section id="v-today"></section>
  <section id="v-students" class="hide"></section>
  <section id="v-more" class="hide"></section>
</main>

<nav>
  <button data-v="today" class="on"><span class="ico">✅</span>الحضور</button>
  <button data-v="students"><span class="ico">👧</span>الطلاب</button>
  <button data-v="more"><span class="ico">⚙️</span>المزيد</button>
</nav>

<dialog id="dlg"><div class="dhead"><h3 class="grow" id="dlgTitle" style="margin:0"></h3><button class="btn-sm" onclick="dlg.close()">إغلاق</button></div><div class="dbody" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" class="hide">

<script>
// سور جزء عمّ (78 → 114)
const SURAHS = {78:'النبأ',79:'النازعات',80:'عبس',81:'التكوير',82:'الانفطار',83:'المطففين',84:'الانشقاق',85:'البروج',86:'الطارق',87:'الأعلى',88:'الغاشية',89:'الفجر',90:'البلد',91:'الشمس',92:'الليل',93:'الضحى',94:'الشرح',95:'التين',96:'العلق',97:'القدر',98:'البينة',99:'الزلزلة',100:'العاديات',101:'القارعة',102:'التكاثر',103:'العصر',104:'الهمزة',105:'الفيل',106:'قريش',107:'الماعون',108:'الكوثر',109:'الكافرون',110:'النصر',111:'المسد',112:'الإخلاص',113:'الفلق',114:'الناس'};
// ترتيب الحفظ المعتاد: من الناس إلى النبأ
const ORDER = Object.keys(SURAHS).map(Number).sort((a,b)=>b-a);
const TOTAL = ORDER.length;
const CLASS_DAYS = [6,1]; // السبت، الاثنين
const WARN_AFTER = 3;     // غيابات متتالية
const DAYS_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const RESULTS = {done:'حفظ ✓', learning:'قيد الحفظ', review:'مراجعة'};
const KEY = 'quran-circle-v1';

let S = load();
let curDate = defaultDate();
let studentsFilter = 'all';

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.students) return d; }catch(e){}
  return {students:[], sessions:{}};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('تعذّر الحفظ! خذي نسخة احتياطية'); }
}
if(navigator.storage && navigator.storage.persist) navigator.storage.persist();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseIso(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function niceDate(s){ const d = parseIso(s); return DAYS_AR[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear(); }
function defaultDate(){
  // اليوم إذا كان يوم دوام، وإلا آخر يوم دوام فات
  const d = new Date();
  for(let i=0;i<7;i++){ if(CLASS_DAYS.includes(d.getDay())) return iso(d); d.setDate(d.getDate()-1); }
  return iso(new Date());
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800); }
const sorted = () => [...S.students].sort((a,b)=>a.name.localeCompare(b.name,'ar'));

// ---------- حسابات ----------
function recordsOf(id){
  return Object.keys(S.sessions).sort().map(date => ({date, ...(S.sessions[date][id]||{})})).filter(r => r.present === true || r.present === false);
}
function streakAbsent(id){
  const r = recordsOf(id); let n = 0;
  for(let i=r.length-1;i>=0;i--){ if(r[i].present === false) n++; else break; }
  return n;
}
function stats(id){
  const r = recordsOf(id);
  return {present:r.filter(x=>x.present).length, absent:r.filter(x=>!x.present).length, streak:streakAbsent(id)};
}
function doneCount(st){ return ORDER.filter(n => st.surahs?.[n] === 'done').length; }
function nextSurah(st){ return ORDER.find(n => st.surahs?.[n] !== 'done'); }
function warned(){ return S.students.filter(s => streakAbsent(s.id) >= WARN_AFTER); }

// ---------- شاشة الحضور ----------
function renderToday(){
  const day = parseIso(curDate).getDay();
  const sess = S.sessions[curDate] || {};
  const list = sorted();
  const marked = list.filter(s => sess[s.id] && (sess[s.id].present === true || sess[s.id].present === false));
  const pres = list.filter(s => sess[s.id]?.present === true).length;
  const w = warned();
  let h = `<div class="card"><label style="margin-top:0">تاريخ الحصة</label>
    <div class="row"><input type="date" id="dateIn" value="${curDate}" class="grow">
    <button class="btn-sm" id="prevDay">◀ السابق</button></div>
    <div class="muted" style="margin-top:6px">${niceDate(curDate)}</div></div>`;
  if(!CLASS_DAYS.includes(day)) h += `<div class="info">هذا اليوم مش سبت ولا اثنين. إذا الحصة انعملت فيه عادي، كمّلي.</div>`;
  if(w.length) h += `<div class="alert">⚠️ غابوا ${WARN_AFTER} مرات متتالية أو أكثر: ${w.map(s=>esc(s.name)).join('، ')}</div>`;
  if(!list.length){
    h += `<div class="card"><p>ما في طلاب لسا.</p><button class="btn-main" onclick="go('students');addStudent()">أضيفي طالب</button>
      <button onclick="go('more')">استيراد من Excel</button></div>`;
    $('#v-today').innerHTML = h; bindToday(); return;
  }
  h += `<div class="summary"><div><b>${list.length}</b><span class="muted">الطلاب</span></div>
    <div><b style="color:var(--ok)">${pres}</b><span class="muted">حاضر</span></div>
    <div><b style="color:var(--bad)">${marked.length-pres}</b><span class="muted">غائب</span></div></div>
    <div class="row" style="margin-bottom:12px"><button class="grow" id="allPresent">الكل حاضر</button>
    <button class="grow" id="shareDay">مشاركة ملخص اليوم</button></div>`;
  for(const s of list){
    const r = sess[s.id] || {};
    const st = streakAbsent(s.id);
    const nx = nextSurah(s);
    h += `<div class="card" data-id="${s.id}">
      <div class="row"><div class="grow"><span class="stu-name">${esc(s.name)}</span>
        ${st>=WARN_AFTER?`<span class="badge b-warn">⚠️ غاب ${st} متتالية</span>`:''}
        <div class="muted">محفوظ ${doneCount(s)}/${TOTAL}${nx?` · التالي: ${SURAHS[nx]}`:' · ختم جزء عمّ 🎉'}</div></div></div>
      <div class="att"><button class="p ${r.present===true?'on':''}" data-act="p">حاضر</button>
        <button class="a ${r.present===false?'on':''}" data-act="a">غائب</button></div>
      <div class="${r.present===true?'':'hide'}">
        <label>السورة اللي سمّعها</label>
        <select data-f="surah"><option value="">—</option>${ORDER.map(n=>`<option value="${n}" ${String(r.surah)===String(n)?'selected':''}>${SURAHS[n]}${s.surahs?.[n]==='done'?' ✓':''}</option>`).join('')}</select>
        <label>النتيجة</label>
        <select data-f="result"><option value="">—</option>${Object.entries(RESULTS).map(([k,v])=>`<option value="${k}" ${r.result===k?'selected':''}>${v}</option>`).join('')}</select>
      </div>
      <label>ملاحظة</label><textarea data-f="note" placeholder="اكتبي ملاحظتك...">${esc(r.note)}</textarea>
    </div>`;
  }
  $('#v-today').innerHTML = h; bindToday();
}
function setRec(id, patch){
  const sess = S.sessions[curDate] = S.sessions[curDate] || {};
  const r = sess[id] = {...(sess[id]||{}), ...patch};
  // النتيجة بتحدّث حالة السورة عند الطالب
  const st = S.students.find(x=>x.id===id);
  if(st && r.present && r.surah && (r.result==='done' || r.result==='learning')){
    st.surahs = st.surahs || {};
    if(!(r.result==='learning' && st.surahs[r.surah]==='done')) st.surahs[r.surah] = r.result;
  }
  save();
}
function bindToday(){
  const di = $('#dateIn');
  if(di) di.onchange = () => { if(di.value){ curDate = di.value; renderToday(); } };
  const pv = $('#prevDay');
  if(pv) pv.onclick = () => { const d = parseIso(curDate); do{ d.setDate(d.getDate()-1); } while(!CLASS_DAYS.includes(d.getDay())); curDate = iso(d); renderToday(); };
  const ap = $('#allPresent');
  if(ap) ap.onclick = () => { for(const s of S.students){ const r = S.sessions[curDate]?.[s.id]; if(!r || r.present == null) setRec(s.id,{present:true}); } renderToday(); toast('تم تسجيل الباقي حاضر'); };
  const sd = $('#shareDay');
  if(sd) sd.onclick = shareDay;
  document.querySelectorAll('#v-today .card[data-id]').forEach(card => {
    const id = card.dataset.id;
    card.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      const cur = S.sessions[curDate]?.[id]?.present;
      const val = b.dataset.act === 'p';
      setRec(id, {present: cur === val ? null : val});
      renderToday();
    });
    card.querySelectorAll('[data-f]').forEach(el => {
      el.onchange = () => { setRec(id, {[el.dataset.f]: el.value}); if(el.tagName==='SELECT'){ renderToday(); } toast('انحفظ'); };
      if(el.tagName==='TEXTAREA') el.oninput = () => { setRec(id, {note: el.value}); };
    });
  });
}
function shareDay(){
  const sess = S.sessions[curDate] || {};
  const lines = ['حلقة جزء عمّ · ' + niceDate(curDate), ''];
  for(const s of sorted()){
    const r = sess[s.id]; if(!r || r.present == null) continue;
    if(!r.present){ lines.push('✗ ' + s.name + ' (غائب)'); continue; }
    let t = '✓ ' + s.name;
    if(r.surah) t += ' · ' + SURAHS[r.surah];
    if(r.result) t += ' · ' + RESULTS[r.result];
    if(r.note) t += ' · ' + r.note;
    lines.push(t);
  }
  const text = lines.join('\n');
  if(navigator.share) navigator.share({text}).catch(()=>{});
  else navigator.clipboard.writeText(text).then(()=>toast('تم النسخ'));
}

// ---------- شاشة الطلاب ----------
function renderStudents(){
  const list = sorted().filter(s => studentsFilter==='all' || streakAbsent(s.id) >= WARN_AFTER);
  let h = `<div class="row" style="margin-bottom:12px"><button class="btn-main grow" onclick="addStudent()">+ طالب جديد</button></div>
    <div class="tabs"><button data-f="all" class="${studentsFilter==='all'?'on':''}">الكل (${S.students.length})</button>
    <button data-f="warn" class="${studentsFilter==='warn'?'on':''}">⚠️ عليهم تحذير (${warned().length})</button></div><div class="card">`;
  if(!list.length) h += `<p class="muted">لا يوجد.</p>`;
  for(const s of list){
    const st = stats(s.id), dc = doneCount(s);
    h += `<div class="list-item" data-id="${s.id}" style="cursor:pointer"><div class="grow">
      <div class="stu-name">${esc(s.name)} ${st.streak>=WARN_AFTER?`<span class="badge b-warn">⚠️ ${st.streak} غياب متتالي</span>`:''}</div>
      <div class="muted">حضر ${st.present} · غاب ${st.absent} · محفوظ ${dc}/${TOTAL}</div>
      <div class="bar"><i style="width:${Math.round(dc/TOTAL*100)}%"></i></div></div><span class="muted">◀</span></div>`;
  }
  h += `</div>`;
  $('#v-students').innerHTML = h;
  document.querySelectorAll('#v-students .tabs button').forEach(b => b.onclick = () => { studentsFilter = b.dataset.f; renderStudents(); });
  document.querySelectorAll('#v-students .list-item').forEach(el => el.onclick = () => openStudent(el.dataset.id));
}
function openDlg(title, html){ $('#dlgTitle').textContent = title; $('#dlgBody').innerHTML = html; if(!dlg.open) dlg.showModal(); }
function studentForm(s){
  return `<label>الاسم</label><input id="fName" value="${esc(s?.name)}">
    <label>ولي الأمر</label><input id="fGuard" value="${esc(s?.guardian)}">
    <label>رقم الهاتف</label><input id="fPhone" type="tel" inputmode="tel" value="${esc(s?.phone)}">
    <label>ملاحظات عامة</label><textarea id="fNotes">${esc(s?.notes)}</textarea>
    <div class="row" style="margin-top:14px"><button class="btn-main grow" id="fSave">حفظ</button></div>`;
}
function addStudent(){
  openDlg('طالب جديد', studentForm());
  $('#fSave').onclick = () => {
    const name = $('#fName').value.trim(); if(!name) return toast('اكتبي الاسم');
    S.students.push({id:uid(), name, guardian:$('#fGuard').value.trim(), phone:$('#fPhone').value.trim(), notes:$('#fNotes').value.trim(), surahs:{}});
    save(); dlg.close(); renderAll(); toast('انضاف');
  };
  setTimeout(()=>$('#fName').focus(), 50);
}
function openStudent(id){
  const s = S.students.find(x=>x.id===id); if(!s) return;
  const st = stats(id), dc = doneCount(s);
  const recs = recordsOf(id).reverse();
  let h = `${st.streak>=WARN_AFTER?`<div class="alert">⚠️ غاب ${st.streak} حصص متتالية. تواصلي مع الأهل.</div>`:''}
    <div class="summary"><div><b style="color:var(--ok)">${st.present}</b><span class="muted">حضور</span></div>
    <div><b style="color:var(--bad)">${st.absent}</b><span class="muted">غياب</span></div>
    <div><b>${dc}/${TOTAL}</b><span class="muted">سورة</span></div></div>
    ${s.guardian||s.phone?`<p>${esc(s.guardian)} ${s.phone?`· <a href="tel:${esc(s.phone)}">${esc(s.phone)}</a> · <a href="https://wa.me/${esc(s.phone.replace(/\D/g,'').replace(/^0/,'962'))}" target="_blank">واتساب</a>`:''}</p>`:''}
    ${s.notes?`<p class="muted">${esc(s.notes)}</p>`:''}
    <h3>الحفظ <span class="muted">(اضغطي على السورة لتغيير حالتها)</span></h3>
    <div class="row muted" style="margin-bottom:8px;font-size:13px"><span class="badge b-ok">محفوظة</span><span class="badge b-mid">قيد الحفظ</span><span class="badge" style="border:1px solid var(--line)">لم تبدأ</span></div>
    <div class="surahs">${ORDER.map(n=>`<button class="surah s-${s.surahs?.[n]||'none'}" data-n="${n}">${SURAHS[n]}<small>${n}</small></button>`).join('')}</div>
    <h3 style="margin-top:16px">سجل الحصص</h3>
    ${recs.length?recs.map(r=>`<div class="log"><b>${niceDate(r.date)}</b> · ${r.present?'<span class="badge b-ok">حاضر</span>':'<span class="badge b-warn">غائب</span>'}
      ${r.surah?' · '+SURAHS[r.surah]:''}${r.result?' · '+RESULTS[r.result]:''}${r.note?`<div class="muted">${esc(r.note)}</div>`:''}</div>`).join(''):'<p class="muted">لا يوجد سجل بعد.</p>'}
    <div class="row" style="margin-top:16px"><button class="grow" id="sEdit">تعديل البيانات</button><button class="btn-danger" id="sDel">حذف</button></div>`;
  openDlg(s.name, h);
  document.querySelectorAll('#dlgBody .surah').forEach(b => b.onclick = () => {
    const n = b.dataset.n, cyc = {none:'learning', learning:'done', done:'none'};
    const nv = cyc[s.surahs?.[n] || 'none'];
    s.surahs = s.surahs || {};
    if(nv === 'none') delete s.surahs[n]; else s.surahs[n] = nv;
    save(); openStudent(id); renderAll(true);
  });
  $('#sEdit').onclick = () => {
    openDlg('تعديل: ' + s.name, studentForm(s));
    $('#fSave').onclick = () => {
      const name = $('#fName').value.trim(); if(!name) return toast('اكتبي الاسم');
      Object.assign(s, {name, guardian:$('#fGuard').value.trim(), phone:$('#fPhone').value.trim(), notes:$('#fNotes').value.trim()});
      save(); renderAll(); openStudent(id); toast('انحفظ');
    };
  };
  $('#sDel').onclick = () => {
    if(!confirm('حذف ' + s.name + ' مع كل سجله؟')) return;
    S.students = S.students.filter(x=>x.id!==id);
    for(const d in S.sessions) delete S.sessions[d][id];
    save(); dlg.close(); renderAll(); toast('انحذف');
  };
}

// ---------- المزيد: استيراد وتصدير ونسخ احتياطي ----------
function renderMore(){
  $('#v-more').innerHTML = `
  <div class="card"><h2>استيراد أسماء الطلاب من Excel</h2>
    <p class="muted">ملف Excel أو CSV. الاسم بالعمود الأول، ولو في عمود ثاني لرقم الهاتف بيتقرأ كمان. الصف الأول إذا كان عنوان بيتجاهل. الأسماء المكررة ما بتنضاف مرتين.</p>
    <button class="btn-main" id="impXl">اختاري ملف Excel</button></div>
  <div class="card"><h2>تقرير Excel</h2>
    <p class="muted">ملف فيه كل طالب: الحضور، الغياب، عدد السور المحفوظة، وسجل كل حصة.</p>
    <button id="expXl">تنزيل التقرير</button></div>
  <div class="card"><h2>النسخة الاحتياطية</h2>
    <p class="muted">البيانات محفوظة على هذا التلفون فقط. خذي نسخة احتياطية كل أسبوع وابعتيها لحالك على واتساب، لأنه إذا انمسح المتصفح أو ضاع التلفون بتروح البيانات.</p>
    <div class="row"><button class="btn-main" id="bkOut">خذي نسخة احتياطية</button><button id="bkIn">استرجاع من نسخة</button></div></div>
  <div class="card"><h2>معلومات</h2><p class="muted">أيام الدوام: السبت والاثنين. التحذير بيطلع لما الطالب يغيب ${WARN_AFTER} حصص ورا بعض. سور جزء عمّ: ${TOTAL} سورة (من الناس للنبأ).</p></div>`;
  $('#impXl').onclick = () => pickFile('.xlsx,.xls,.csv', importStudents);
  $('#expXl').onclick = exportReport;
  $('#bkOut').onclick = backup;
  $('#bkIn').onclick = () => pickFile('.json,application/json', restore);
}
function pickFile(accept, cb){ const f = $('#fileIn'); f.value = ''; f.accept = accept; f.onchange = () => f.files[0] && cb(f.files[0]); f.click(); }
function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload = ok; sc.onerror = () => no(new Error('net')); document.head.appendChild(sc); });
}
async function readRows(file){
  if(/\.csv$/i.test(file.name)){
    const txt = await file.text();
    return txt.split(/\r?\n/).map(l => l.split(/[,;\t]/).map(c => c.replace(/^"|"$/g,'').trim()));
  }
  await loadXLSX();
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''}).map(r => r.map(c => String(c).trim()));
}
async function importStudents(file){
  let rows;
  try{ rows = await readRows(file); }catch(e){ return toast('ما قدرت أقرأ الملف. تأكدي من الإنترنت أول مرة'); }
  const have = new Set(S.students.map(s => s.name.replace(/\s+/g,' ')));
  let added = 0;
  rows.forEach((r, i) => {
    const cells = r.filter(c => c !== '');
    if(!cells.length) return;
    let name = cells.find(c => /[؀-ۿa-zA-Z]/.test(c) && !/^\+?[\d\s-]{6,}$/.test(c));
    if(!name) return;
    name = name.replace(/\s+/g,' ');
    if(i === 0 && /اسم|الطالب|name/i.test(name)) return; // صف العناوين
    if(have.has(name)) return;
    const phone = cells.find(c => /^\+?[\d\s-]{7,}$/.test(c)) || '';
    S.students.push({id:uid(), name, guardian:'', phone, notes:'', surahs:{}});
    have.add(name); added++;
  });
  save(); renderAll(); toast('انضاف ' + added + ' طالب');
}
async function exportReport(){
  const dates = Object.keys(S.sessions).sort();
  const sum = [['الاسم','الهاتف','حضور','غياب','غياب متتالي','سور محفوظة','قيد الحفظ','السور المحفوظة']];
  for(const s of sorted()){
    const st = stats(s.id);
    sum.push([s.name, s.phone||'', st.present, st.absent, st.streak, doneCount(s), ORDER.filter(n=>s.surahs?.[n]==='learning').length, ORDER.filter(n=>s.surahs?.[n]==='done').map(n=>SURAHS[n]).join('، ')]);
  }
  const log = [['التاريخ','الاسم','الحضور','السورة','النتيجة','ملاحظة']];
  for(const d of dates) for(const s of sorted()){
    const r = S.sessions[d][s.id]; if(!r || r.present == null) continue;
    log.push([d, s.name, r.present?'حاضر':'غائب', r.surah?SURAHS[r.surah]:'', r.result?RESULTS[r.result]:'', r.note||'']);
  }
  const name = 'تقرير-الحلقة-' + iso(new Date());
  try{
    await loadXLSX();
    const wb = XLSX.utils.book_new();
    const a = XLSX.utils.aoa_to_sheet(sum), b = XLSX.utils.aoa_to_sheet(log);
    a['!views'] = b['!views'] = [{RTL:true}];
    XLSX.utils.book_append_sheet(wb, a, 'الملخص'); XLSX.utils.book_append_sheet(wb, b, 'سجل الحصص');
    wb.Workbook = {Views:[{RTL:true}]};
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    downloadBlob(new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), name + '.xlsx');
  }catch(e){
    // بدون إنترنت: CSV بيفتح بالـ Excel
    const csv = '﻿' + sum.concat([[]], log).map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(',')).join('\n');
    downloadBlob(new Blob([csv], {type:'text/csv'}), name + '.csv');
  }
}
async function downloadBlob(blob, filename){
  const file = new File([blob], filename, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:filename}); return; }catch(e){ if(e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function backup(){
  downloadBlob(new Blob([JSON.stringify({app:'quran-circle', version:1, savedAt:new Date().toISOString(), data:S})], {type:'application/json'}), 'نسخة-الحلقة-' + iso(new Date()) + '.json');
  localStorage.setItem(KEY + '-lastBackup', iso(new Date()));
}
async function restore(file){
  try{
    const j = JSON.parse(await file.text()); const d = j.data || j;
    if(!Array.isArray(d.students) || typeof d.sessions !== 'object') throw 0;
    if(!confirm('استرجاع النسخة بيستبدل البيانات الحالية (' + d.students.length + ' طالب). متأكدة؟')) return;
    S = d; save(); renderAll(); toast('تم الاسترجاع');
  }catch(e){ toast('الملف مش نسخة احتياطية صحيحة'); }
}

// ---------- تنقّل ----------
let curView = 'today';
function go(v){
  curView = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  ['today','students','more'].forEach(x => $('#v-' + x).classList.toggle('hide', x !== v));
  renderAll(); scrollTo(0,0);
}
function renderAll(keepDlg){
  const n = warned().length;
  $('#hsub').textContent = S.students.length + ' طالب' + (n ? ' · ⚠️ ' + n + ' عليهم تحذير' : '');
  if(curView === 'today') renderToday();
  if(curView === 'students') renderStudents();
  if(curView === 'more') renderMore();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));
renderAll();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
